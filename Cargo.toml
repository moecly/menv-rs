[package]
name = "menv-rs"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/moecly/menv-rs"
authors = ["moecly"]
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
serde = {version="1.0.228", features = ["derive"]}
config = "0.15.23"
dirs = "6.0.0"
colored = "3.1.1"
indicatif = "0.18.4"
console = "0.16.3"
comfy-table = "7.2.2"
parking_lot = "0.12.5"
self_update = "0.44.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"



